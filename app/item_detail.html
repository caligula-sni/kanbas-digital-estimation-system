<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Item Detail — KANBAS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<div class="app-layout">
    <div id="nav-container"></div>
    <div class="content">
        <p><a href="items.html">&larr; Back to Search Materials</a></p>
        <div id="detail-container"><div class="empty-state">Loading...</div></div>
    </div>
</div>

<script src="js/nav.js"></script>
<script src="js/items-data.js"></script>
<script src="js/kanbas-store.js"></script>
<script>
    renderNav('items');

    const params = new URLSearchParams(window.location.search);
    const item = getItemById(params.get('id'));
    const container = document.getElementById('detail-container');

    if (!item) {
        container.innerHTML = '<h1>Item not found</h1>';
    } else {
        container.innerHTML =
            '<h1>' + item.name + '</h1>' +
            '<div class="panel" style="max-width:420px;">' +
            '<p><strong>Price:</strong> ' + formatPeso(item.price) + ' per ' + item.unit + '</p>' +
            '<p style="margin-top:8px; color:#555;">' + item.description + '</p>' +
            '<p class="source-tag ' + (item.verified ? 'verified' : 'estimated') + '">' +
            (item.verified ? '\u2713 Verified' : '\u25CB Estimated') + ' — ' + item.source +
            '</p>' +
            '<div id="add-area" style="margin-top:16px;"></div>' +
            '</div>';

        const area = document.getElementById('add-area');

        if (hasDraft()) {
            const draft = getDraft();
            if (draft.category !== 'mixed' && draft.category !== item.category) {
                area.innerHTML =
                    '<p style="color:#777;">This item is in <strong>' + getCategoryLabel(item.category) + '</strong>, ' +
                    'but your current Kanbas ("' + draft.name + '") is <strong>' + getCategoryLabel(draft.category) + '</strong>. ' +
                    'A Kanbas can only hold items from one category. ' +
                    '<a href="kanbas_new.html">Start a new ' + getCategoryLabel(item.category) + ' Kanbas</a> to add this item.</p>';
            } else {
                area.innerHTML =
                    '<div class="inline-form">' +
                    '<input type="number" id="qty" value="1" min="1" style="width:80px;">' +
                    '<button type="button" id="add-btn" class="small-btn">Add to Kanbas</button>' +
                    '</div>';
                document.getElementById('add-btn').addEventListener('click', function () {
                    const qty = Math.max(1, parseInt(document.getElementById('qty').value, 10) || 1);
                    addItemToDraft({ item_id: item.id, name: item.name, price: item.price, unit: item.unit, quantity: qty });
                    window.location.href = 'kanbas_build.html';
                });
            }
        } else {
            area.innerHTML = '<p style="color:#777;"><a href="kanbas_new.html">Start a Kanbas</a> to add this item.</p>';
        }
    }
</script>
</body>
</html>
