<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Materials — KANBAS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<div class="app-layout">
    <div id="nav-container"></div>
    <div class="content">
        <h1>Search Materials</h1>
        <p id="draft-hint" style="color:#777; margin-bottom:16px;"></p>

        <div id="category-tabs" class="category-tabs"></div>

        <form class="search-box" onsubmit="return false;">
            <input type="text" id="search-input" placeholder="Search items...">
            <button type="button" id="search-btn">Search</button>
        </form>

        <div id="item-grid"></div>
    </div>
</div>

<script src="js/nav.js"></script>
<script src="js/items-data.js"></script>
<script src="js/kanbas-store.js"></script>
<script>
    renderNav('items');

    const draft = getDraft();
    const hint = document.getElementById('draft-hint');
    hint.innerHTML = draft
        ? 'Building "<strong>' + draft.name + '</strong>" (' + getCategoryLabel(draft.category) + ') — <a href="kanbas_build.html">go to builder</a>'
        : 'Browsing only. <a href="kanbas_new.html">Start a Kanbas</a> to add items to a list.';

    let activeCategory = '';

    function renderTabs() {
        const tabsHtml = ['<button type="button" class="cat-tab' + (activeCategory === '' ? ' active' : '') + '" data-cat="">All</button>']
            .concat(CATEGORIES.map(function (c) {
                return '<button type="button" class="cat-tab' + (activeCategory === c.key ? ' active' : '') + '" data-cat="' + c.key + '">' + c.label + '</button>';
            }));
        document.getElementById('category-tabs').innerHTML = tabsHtml.join('');

        document.querySelectorAll('.cat-tab').forEach(function (btn) {
            btn.addEventListener('click', function () {
                activeCategory = btn.dataset.cat;
                renderTabs();
                renderGrid(document.getElementById('search-input').value);
            });
        });
    }

    function renderGrid(query) {
        const results = searchItems(query, activeCategory);
        const grid = document.getElementById('item-grid');

        if (results.length === 0) {
            grid.innerHTML = '<div class="empty-state">No items found.</div>';
            return;
        }

        grid.innerHTML = '<div class="item-grid">' + results.map(function (item) {
            return '<a class="item-card" href="item_detail.html?id=' + item.id + '">' +
                '<div class="name">' + item.name + '</div>' +
                '<div class="price">' + formatPeso(item.price) + '</div>' +
                '<div class="unit">per ' + item.unit + '</div>' +
                '</a>';
        }).join('') + '</div>';
    }

    renderTabs();
    renderGrid('');

    document.getElementById('search-btn').addEventListener('click', function () {
        renderGrid(document.getElementById('search-input').value);
    });
    document.getElementById('search-input').addEventListener('keyup', function () {
        renderGrid(this.value);
    });
</script>
</body>
</html>
