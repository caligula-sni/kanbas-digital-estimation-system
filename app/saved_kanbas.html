<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saved Kanbas — KANBAS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<div class="app-layout">
    <div id="nav-container"></div>
    <div class="content">
        <h1>Saved Kanbas</h1>

        <form class="search-box" onsubmit="return false;">
            <input type="text" id="search-input" placeholder="Search by name...">
            <button type="button" id="search-btn">Search</button>
        </form>

        <div id="list-container"></div>
    </div>
</div>

<script src="js/nav.js"></script>
<script src="js/kanbas-store.js"></script>
<script>
    renderNav('saved');

    function render(filter) {
        filter = (filter || '').toLowerCase();
        let list = getSavedKanbas().slice().reverse();
        if (filter) {
            list = list.filter(function (k) { return k.name.toLowerCase().includes(filter); });
        }

        const container = document.getElementById('list-container');
        if (list.length === 0) {
            container.innerHTML = '<div class="empty-state">No saved Kanbas yet. <a href="kanbas_new.html">Create one</a>.</div>';
            return;
        }

        container.innerHTML = list.map(function (k) {
            const date = new Date(k.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            return '<a class="kanbas-list-item" href="kanbas_view.html?id=' + k.id + '">' +
                '<strong>' + k.name + '</strong>' +
                '<div class="meta">' + k.category + ' &middot; ' + date + '</div>' +
                '</a>';
        }).join('');
    }

    render('');
    document.getElementById('search-btn').addEventListener('click', function () {
        render(document.getElementById('search-input').value);
    });
    document.getElementById('search-input').addEventListener('keyup', function () {
        render(this.value);
    });
</script>
</body>
</html>
